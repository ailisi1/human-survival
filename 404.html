<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>走岔了 · 人间三卷</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    background: linear-gradient(160deg, #f5efe0 0%, #ece2cc 55%, #e4d6b8 100%);
    color: #3b3128;
    font-family: "Noto Serif SC", "Source Han Serif SC", "SimSun", serif;
    display: flex; align-items: center; justify-content: center;
    text-align: center; padding: 24px;
  }
  .inner { max-width: 460px; }
  .seal {
    width: 56px; height: 56px; margin: 0 auto 30px;
    background: #9c2b1e; color: #faf7ee;
    font-size: 30px; line-height: 56px; border-radius: 6px;
    box-shadow: 0 3px 10px rgba(120,20,10,.25);
  }
  h1 { font-size: 34px; letter-spacing: 6px; margin-bottom: 18px; }
  p { font-size: 16px; line-height: 2; color: #6d5c44; margin-bottom: 34px; }
  a {
    display: inline-block; padding: 12px 42px;
    background: #9c2b1e; color: #faf7ee; text-decoration: none;
    font-size: 16px; letter-spacing: 4px; border-radius: 4px;
  }
  a:hover { background: #7e2116; }
</style>
</head>
<body>
  <div class="inner">
    <div class="seal">三</div>
    <h1>走岔了</h1>
    <p>这一页不在三卷里。<br>卷是死的，路是活的——回去，另翻一卷。</p>
    <a href="/">回人间三卷</a>
  </div>
</body>
</html>
