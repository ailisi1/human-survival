<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>到访人数 · 本地联调</title>
<link rel="stylesheet" href="../portal/style.css">
<style>
  body { padding: 40px 24px; }
  .tip { max-width: 560px; margin: 0 auto 28px; font-size: 13px; line-height: 1.9; color: #6b6357; }
  .tip code { background: rgba(0,0,0,.05); padding: 1px 5px; border-radius: 3px; }
  .box { max-width: 560px; margin: 0 auto; border: 1px solid #d9d2c2; }
</style>
</head>
<body>

<div class="tip">
  这是给 <code>portal/hit.js</code> 做本地联调的页面，不上线。<br>
  先跑 <code>node worker/dev-server.mjs</code>，再在项目根起一个静态服务，访问本页。<br>
  下面的页脚应当出现「已有 N 人到访」；用 <code>file://</code> 直接打开则什么都不显示（这是设计）。
</div>

<div class="box">
  <footer class="foot">
    <p>人间三卷 · 纯静态，无需服务器，双击即可打开</p>
    <p>无账号 · 无追踪 · 不记录你是谁，只记一个到访数字 · 三卷彼此独立，也可以单独打开</p>
    <p class="foot-hit" data-hit hidden></p>
    <p class="foot-stamp">数据核对 2026-11-01</p>
  </footer>
</div>

<script>window.HUB_HIT_ENDPOINT = "http://localhost:8791";</script>
<script src="../portal/hit.js"></script>
</body>
</html>
