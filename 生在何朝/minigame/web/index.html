<style>
  html, body {
    margin: 0; height: 100%; overflow: hidden; background: #f3efe3;
    font-family: "Songti SC", serif;
  }
  /* 固定成一块手机屏，贴左上角。
     无头浏览器的排版宽度与截图宽度不总是一致，居中或自适应都会把右边切掉。 */
  canvas {
    position: absolute; left: 0; top: 0;
    width: 390px; height: 844px;
    display: block; background: #f3efe3; touch-action: none;
  }
  /* 模拟微信右上角胶囊，只在带 ?cap= 参数时出现 */
  #cap {
    position: absolute; display: none;
    border-radius: 16px; background: rgba(255,255,255,.55);
    border: 1px solid rgba(0,0,0,.14);
    font: 12px/32px -apple-system, sans-serif; text-align: center;
    color: rgba(0,0,0,.5); letter-spacing: 2px;
  }

<script>
(function () {
  var W = 390, H = 844;

  /* 调试参数：?notch=44&home=34 模拟刘海屏与底部指示条；
     ?dpr=2 强行指定像素比，用来复现开发者工具那种「2 倍位图挤在 1 倍窗口里」的发虚。 */
  var q = new URLSearchParams(location.search);
  var safeT = +(q.get("notch") || 0);
  var safeB = +(q.get("home") || 0);
  /* ?cap=96&capb=82 模拟右上角微信胶囊，用来检查顶栏有没有让开 */
  var capL = +(q.get("cap") || 0);
  var capB = +(q.get("capb") || 0);
  var dpr = +(q.get("dpr") || 0) || Math.min(3, window.devicePixelRatio || 2);

  var cv = document.getElementById("cv");
  cv.width = Math.round(W * dpr);
  cv.height = Math.round(H * dpr);
  var ctx = cv.getContext("2d");
  ctx.scale(dpr, dpr);

  APP.boot({ ctx: ctx, W: W, H: H, dpr: dpr, safeT: safeT, safeB: safeB, capL: capL, capB: capB });

  /* 画一个假胶囊盖在画布上，才能看出顶栏有没有让开 */
  if (capL > 0 && capB > 0) {
    var el = document.getElementById("cap");
    el.style.display = "block";
    el.style.left = capL + "px";
    el.style.top = (capB - 32) + "px";
    el.style.width = "87px";
    el.style.height = "32px";
  }

  /* 调试：?demo=birth|event|dead|realm|eras&era=ming&tab=0&seed=5 */
  var demo = q.get("demo");
  if (demo) {
    APP.state.__demo(demo, q.get("era"), +(q.get("seed") || 20261030), +(q.get("tab") || 0));
  }

  var down = false;
  function pos(e) {
    var r = cv.getBoundingClientRect();
    var t = e.touches ? e.touches[0] : e;
    return { x: t.clientX - r.left, y: t.clientY - r.top };
  }
  function start(e) { e.preventDefault(); down = true; var p = pos(e); APP.touch("start", p.x, p.y); }
  function move(e) { if (!down) return; e.preventDefault(); var p = pos(e); APP.touch("move", p.x, p.y); }
  function end(e) { if (!down) return; down = false; var p = pos(e); APP.touch("end", p.x, p.y); }

  cv.addEventListener("mousedown", start);
  window.addEventListener("mousemove", move);
  window.addEventListener("mouseup", end);
  cv.addEventListener("touchstart", start, { passive: false });
  cv.addEventListener("touchmove", move, { passive: false });
  cv.addEventListener("touchend", end, { passive: false });

  /* 供无头截图等待用 */
  window.__READY = true;
})();
</script>
